{% extends "base.html" %}

{% block title %}Connexion — Championnat de Scrabble{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Connexion</h1>
        {% if form.errors %}
          <div class="alert alert-danger">Identifiant ou mot de passe incorrect.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Identifiant</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Mot de passe</label>
            {{ form.password }}
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'accounts:password_reset' %}">Mot de passe oublié ?</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
