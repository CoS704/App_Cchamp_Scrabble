{% extends "base.html" %}

{% block title %}Mot de passe oublié{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Mot de passe oublié</h1>
        <p class="text-muted">
          Indiquez votre adresse e-mail : si un compte y correspond, un lien de
          réinitialisation vous sera envoyé.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.email.id_for_label }}">Adresse e-mail</label>
            {{ form.email }}
          </div>
          <button type="submit" class="btn btn-primary w-100">Envoyer le lien</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
